<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VME50</title>
    <style>
        /* python3 cryptography */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        body {
            display: grid;
            place-items: center;
        }

       
        .content-container {
            display: flex;
            flex-direction: column; 
            align-items: center;    
            justify-content: center;  
            width: 90%; 
            max-width: 1200px; 
        }

        .cat-gif {
            max-width: 100%; 
            max-height: 35vh; 
            height: auto; 
            margin-bottom: 2rem; 
        }
        
        .crazy-text {
            font-family: Impact, Arial Black, "Heiti SC", "Microsoft YaHei", sans-serif;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            font-size: clamp(1.5rem, 10vw, 10rem); 
            word-wrap: break-word;
            overflow-wrap: break-word;
            animation: crazyColors 0.4s steps(1, end) infinite;
            text-shadow: 
                0 0 7px #fff, 
                0 0 12px #fff, 
                0 0 25px #00f, 
                0 0 35px #00f;
        }

        @keyframes crazyColors {
            0%   { color: #ff00de; }
            15%  { color: #76ff03; }
            30%  { color: #03a9f4; }
            45%  { color: #ffff00; }
            60%  { color: #00ffff; }
            75%  { color: #ff00ff; }
            90%  { color: #ff5722; }
            100% { color: #ffffff; }
        }
    /* gAAAAABoSpO0vV0QaYjDi1-XPqw_D25RvZFVGkZmuCQapjbMkETAZSsWxb61nHufqBJNIRV9qhJbGUnxR5QGejruZBmyxL5wtA== */  
    </style>
</head>
<body>
    
    <main class="content-container">
        <img src="happycat.gif" alt="happycat" class="cat-gif">

        <h1 class="crazy-text">KFC#CRAZY4#VME#50</h1>
    </main>

</body>
</html>
