<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VME50</title>
    <style>
    /* python3 cryptography */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center; 
            background-color: #000;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .cat-gif {
            max-width: 80%; 
            max-height: 40vh; 
            height: auto; 
            margin-bottom: 20px; 
        }
        
        .crazy-text {
            font-family: Impact, Arial Black, "Heiti SC", "Microsoft YaHei", sans-serif;
            font-weight: bold;
            text-align: center;
            font-size: 10vw;
            line-height: 1.1;
            animation: crazyColors 0.4s steps(1, end) infinite;
            text-shadow: 
                0 0 7px #fff, 
                0 0 12px #fff, 
                0 0 25px #00f, 
                0 0 35px #00f;
        }

        @media (max-width: 992px) {
            .crazy-text { font-size: 13vw; }
        }
        @media (max-width: 600px) {
            .crazy-text { font-size: 16vw; }
        }

        @keyframes crazyColors {
            0%   { color: #ff00de; }
            15%  { color: #76ff03; }
            30%  { color: #03a9f4; }
            45%  { color: #ffff00; }
            60%  { color: #00ffff; }
            75%  { color: #ff00ff; }
            90%  { color: #ff5722; }
            100% { color: #ffffff; }
        }
