<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Crazy Text - Vertical</title>
    <style>
        /* CSS 样式部分 */

        /* 基础页面设置，让内容垂直水平居中 */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000; /* 使用纯黑背景 */
            overflow: hidden; /* 防止文字过大时出现滚动条 */
        }

        /* ---------------------------------------------------- */
        /* --- 自适应文字大小的核心部分 --- */
        /* ---------------------------------------------------- */

        /* 1. 默认样式 (用于桌面等大屏幕) */
        .crazy-text {
            font-family: Impact, Arial Black, "Heiti SC", "Microsoft YaHei", sans-serif;
            font-weight: bold;
            text-align: center;
            
            /* 调整了字体大小和行高以适应垂直布局 */
            font-size: 10vw; 
            line-height: 1.1; /* 行与行之间的间距 */

            /* 应用下面定义的动画效果 */
            animation: crazyColors 0.4s steps(1, end) infinite;
            text-shadow: 
                0 0 7px #fff, 
                0 0 12px #fff, 
                0 0 25px #00f, 
                0 0 35px #00f;
        }

        /* 2. 针对中等屏幕 (如平板电脑) 的样式 */
        /* 当屏幕宽度小于或等于 992px 时，应用这些样式 */
        @media (max-width: 992px) {
            .crazy-text {
                font-size: 13vw;
                line-height: 1.2;
            }
        }

        /* 3. 针对小屏幕 (如手机) 的样式 */
        /* 当屏幕宽度小于或等于 600px 时，应用这些样式 */
        @media (max-width: 600px) {
            .crazy-text {
                font-size: 16vw;
                line-height: 1.2;
            }
        }


        /* ---------------------------------------------------- */
        /* --- 颜色闪烁动画部分 (与之前相同) --- */
        /* ---------------------------------------------------- */

        @keyframes crazyColors {
            0%   { color: #ff00de; } /* 亮粉 */
            15%  { color: #76ff03; } /* 亮绿 */
            30%  { color: #03a9f4; } /* 亮蓝 */
            45%  { color: #ffff00; } /* 亮黄 */
            60%  { color: #00ffff; } /* 青色 */
            75%  { color: #ff00ff; } /* 品红 */
            90%  { color: #ff5722; } /* 亮橙 */
            100% { color: #ffffff; } /* 白色 */
        }
    </style>
</head>
<body>

    <h1 class="crazy-text">
        KFC<br>
        CRAZY4<br>
        VME<br>
        50
    </h1>

</body>
</html>
