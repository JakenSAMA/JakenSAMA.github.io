<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VME50</title>
    <style>
        /* CSS 样式部分 */

        /* 基础页面设置 */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            
            /* --- 主要改动 1 --- */
            /* 将主轴方向改为垂直，让图片和文字可以上下排列 */
            flex-direction: column; 
            
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            background-color: #000;
            overflow: hidden;
            padding: 20px; /* 添加一些内边距，防止内容紧贴边缘 */
            box-sizing: border-box;
        }

        /* --- 主要改动 2 --- */
        /* 为 GIF 动态图添加样式 */
        .cat-gif {
            /* 限制图片的最大宽度，使其在任何屏幕上都不会过大 */
            max-width: 80%; 
            /* 限制最大高度，防止图片在竖屏手机上过高 */
            max-height: 40vh; /* vh 是视窗高度的单位 */
            height: auto; /* 保持图片原始宽高比 */
            /* 在图片下方增加一些间距 */
            margin-bottom: 20px; 
        }


        /* 闪烁文字的样式 (基本保持不变) */
        .crazy-text {
            font-family: Impact, Arial Black, "Heiti SC", "Microsoft YaHei", sans-serif;
            font-weight: bold;
            text-align: center;
            font-size: 10vw;
            line-height: 1.1;
            animation: crazyColors 0.4s steps(1, end) infinite;
            text-shadow: 
                0 0 7px #fff, 
                0 0 12px #fff, 
                0 0 25px #00f, 
                0 0 35px #00f;
        }

        /* 媒体查询，用于自适应 (基本保持不变) */
        @media (max-width: 992px) {
            .crazy-text { font-size: 13vw; }
        }
        @media (max-width: 600px) {
            .crazy-text { font-size: 16vw; }
        }

        /* 颜色闪烁动画 (保持不变) */
        @keyframes crazyColors {
            0%   { color: #ff00de; }
            15%  { color: #76ff03; }
            30%  { color: #03a9f4; }
            45%  { color: #ffff00; }
            60%  { color: #00ffff; }
            75%  { color: #ff00ff; }
            90%  { color: #ff5722; }
            100% { color: #ffffff; }
        }
    </style>
</head>
<body>

    <img src="happycat.gif" alt="happycat" class="cat-gif">

    <h1 class="crazy-text">
        KFC<br>
        CRAZY4<br>
        VME<br>
        50
    </h1>

</body>
</html>
